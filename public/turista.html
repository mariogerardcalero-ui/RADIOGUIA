<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourist Road Guides - Turista</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="header">
    <div class="logo"><i class="ti ti-map-2"></i></div>
    <div>
      <h1>Tourist Road Guides</h1>
      <p>Vista Turista</p>
    </div>
  </div>

  <div class="panel active" style="display:block; padding:20px;">
    <div class="card">
      <span class="badge offline" id="listenerBadge">Sin emisión</span>
      <div class="wave" id="audioWave">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <p style="font-size:14px; color:#888;" id="listenerStatus">El guía no está emitiendo</p>
    </div>
    <button class="btn btn-primary" id="joinBtn" onclick="toggleJoin()">
      <i class="ti ti-headphones"></i>
      <span id="joinText">Unirse al canal</span>
    </button>
    <p class="hint" style="margin-top:12px;">Cuando el guía empiece a hablar, el audio llegará automáticamente.</p>
  </div>

  <audio id="remoteAudio" autoplay></audio>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/turista.js"></script>
</body>
</html>
