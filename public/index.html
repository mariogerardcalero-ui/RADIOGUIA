<script src="/socket.io/socket.io.js"></script>
<!DOCTYPE html>
<html lang="es">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourist Road Guides - Radio Guía</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="header">
    <div class="logo"><i class="ti ti-map-2"></i></div>
    <div>
      <h1>Tourist Road Guides</h1>
      <p>Radio guía en vivo</p>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('guide')" id="tab-guide">
      <i class="ti ti-microphone"></i> Guía
    </div>
    <div class="tab" onclick="switchTab('tourist')" id="tab-tourist">
      <i class="ti ti-headphones"></i> Turista
    </div>
  </div>

  <div class="panel active" id="panel-guide">
    <div class="card">
      <button class="mic-btn" id="micBtn" onclick="toggleMic()">
        <i class="ti ti-microphone" id="micIcon"></i>
      </button>
      <p style="font-size:14px; color:#888; margin-bottom:4px;">Estado</p>
      <p style="font-size:18px; font-weight:500;" id="micStatus">Inactivo</p>
    </div>
    <div class="info-row">
      <div class="info-box">
        <div class="val" id="listenerCount">0</div>
        <div class="lbl">escuchando</div>
      </div>
      <div class="info-box">
        <div class="val" id="timeActive">0:00</div>
        <div class="lbl">tiempo activo</div>
      </div>
    </div>
    <p class="hint">Pulsa el micrófono para empezar a emitir.</p>
  </div>

  <div class="panel" id="panel-tourist">
    <div class="card">
      <span class="badge offline" id="listenerBadge">Sin emisión</span>
      <div class="wave" id="audioWave">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <p style="font-size:14px; color:#888;" id="listenerStatus">El guía no está emitiendo</p>
    </div>
    <button class="btn btn-primary" id="joinBtn" onclick="toggleJoin()">
      <i class="ti ti-headphones"></i>
      <span id="joinText">Unirse al canal</span>
    </button>
    <p class="hint" style="margin-top:12px;">Cuando el guía empiece a hablar, el audio llegará automáticamente.</p>
  </div>

  <script src="app.js"></script>
  <audio id="remoteAudio" autoplay></audio>
</body>
</html>
